<VirtualHost *:443>
    ServerName saas.dental.local
    DocumentRoot "C:/xampp/htdocs/dental-saas/public"

    SSLEngine on
    SSLCertificateFile "C:/xampp/apache/conf/ssl.crt/server.crt"
    SSLCertificateKeyFile "C:/xampp/apache/conf/ssl.key/server.key"

    <Directory "C:/xampp/htdocs/dental-saas/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <IfModule mod_setenvif.c>
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </IfModule>
</VirtualHost>
